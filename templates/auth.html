<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Join - Opinion</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"/>
    <link rel="stylesheet" href="{{ url_for('static', filename='auth.css') }}"/>
</head>
<body>
    <nav>
        <a href="/" class="logo">
            <span class="home-icon">🏠</span>
        </a>
    </nav>

    <section class="auth-section">
        <div class="auth-tabs">
            <button class="tab active" onclick="showTab('signup', this)">Sign Up</button>
            <button class="tab" onclick="showTab('login', this)">Login</button>
        </div>

        {% if error %}
        <p class="error-msg">⚠ {{ error }}</p>
        {% endif %}

        <div id="signup" class="auth-form">
            <form method="POST" action="/signup">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                <input type="text" name="nickname" placeholder="Choose a Nickname" required/>
                <small class="hint">⚠ Apna real naam use na karein - public ye name dekhegi</small>
                <input type="email" name="email" placeholder="Email (aapka email safe rahega)" required/>
                <div class="pass-wrap">
                    <input type="password" id="pass1" name="password" placeholder="Password (8 se zyada charachters ka use karein)" required/>
                    <span onclick="togglePass('pass1')">👁</span>
                </div>
                <button type="submit">Join Now</button>
            </form>
        </div>

        <div id="login" class="auth-form hidden">
            <form method="POST" action="/login">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                <input type="email" name="email" placeholder="Email" required/>
                <div class="pass-wrap">
                    <input type="password" id="pass2" name="password" placeholder="Password" required/>
                    <span onclick="togglePass('pass2')">👁</span>
                </div>
                <button type="submit">Login</button>
            </form>
        </div>
    </section>

    <script>
        function showTab(tab, btn) {
            document.getElementById('signup').classList.add('hidden');
            document.getElementById('login').classList.add('hidden');
            document.getElementById(tab).classList.remove('hidden');
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            btn.classList.add('active');
        }

        function togglePass(id) {
            const input = document.getElementById(id);
            input.type = input.type === 'password' ? 'text' : 'password';
        }
    </script>
</body>
</html>
