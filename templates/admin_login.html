<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Admin - Opinion</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"/>
    <link rel="stylesheet" href="{{ url_for('static', filename='auth.css') }}"/>
</head>
<body>
    <nav>
        <div class="logo">
            <a href="/"><h1>Opinion</h1></a>
            <small>the debate for truth</small>
        </div>
    </nav>

    <section class="auth-section">
        <h2 style="margin-bottom:1.5rem;">Admin Access</h2>

        {% if error %}
        <p class="error-msg">⚠ {{ error }}</p>
        {% endif %}

        <form method="POST" action="/admin">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
            <input type="password" name="password" placeholder="Admin password" required/>
            <button type="submit" class="btn-primary" style="width: 100%; padding: 0.9rem; border: none; cursor: pointer;">
                Enter
            </button>
        </form>
    </section>
    
</body>
</html>
